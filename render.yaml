# Render Blueprint: Neha (bot) + knowledge base, Free plan, Singapore (closest Render region to Delhi NCR).
#   1. Render dashboard -> New -> Blueprint -> this repo.
#   2. Fill the env vars marked sync:false (keys) in the dashboard. Never commit them.
#   3. kb service -> Environment -> Secret Files: add qa_pages.jsonl.gz.b64 (customer-call answers, not in git).
#   Full steps and checks: deploy/render/README.md
#
# Free plan: services sleep after 15 min idle (first call ~30-60 s), 512 MB RAM each, no persistent disk, and a
# free service cannot receive private-network traffic, so the kb has a public URL with its search locked by a key.

envVarGroups:
  - name: neha-shared
    envVars:
      - key: KB_ADMIN_KEY            # one generated secret: the bot sends it, the kb requires it
        generateValue: true

services:
  # ---------------------------------------------------------------- Neha (Python voice server + widget)
  - type: web
    name: acr-neha-bot
    # Docker: bakes in the meaning matcher (multilingual-e5-small ONNX, ~150 MB RAM), which the native Python
    # build lacked. Same image as Railway.
    runtime: docker
    dockerfilePath: ./deploy/railway/bot.Dockerfile
    dockerContext: .
    # free = preview: sleeps after 15 min idle, no persistent disk. For customers: plan starter or higher.
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - fromGroup: neha-shared
      - key: HUMAN_BOT_BEHIND_PROXY
        value: "1"
      # "1": the bot's own URL shows autocarrepair.in with the Neha launcher injected, like
      # http://127.0.0.1:4001 on the laptop (demo). Trackers are blocked and the site's form is answered
      # locally in that copy, so no fake visits or leads reach ACR. For customers the dealer site carries the
      # one-line script tag instead; set this to "0" then.
      - key: HUMAN_BOT_SITE_MIRROR
        value: "1"
      - key: HUMAN_BOT_ALLOWED_ORIGINS
        value: https://autocarrepair.in,https://www.autocarrepair.in,https://avatarwidget-five.vercel.app
      - key: HUMAN_BOT_AVATAR_PROVIDER
        value: puppet
      - key: HUMAN_BOT_VOICE_STYLE
        value: hindi
      - key: HUMAN_BOT_RECORD        # off until the privacy-policy line about recording is live
        value: "0"
      - key: ACR_LEADS_MODE          # leads logged, not posted, until the website developer signs off
        value: dry
      - key: KB_URL
        fromService:
          type: web
          name: acr-neha-kb
          envVarKey: RENDER_EXTERNAL_URL
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY        # optional: faster speech-to-text
        sync: false
      - key: BITRIX24_WEBHOOK_URL    # optional: leads into Bitrix24
        sync: false
      - key: SIMLI_API_KEY
        sync: false
      - key: HUMAN_BOT_ADMIN_KEY
        generateValue: true

  # ---------------------------------------------------------------- knowledge base (Node)
  - type: web
    name: acr-neha-kb
    runtime: node
    # free (512 MB) runs the lexical + Gemini path; the local embedding model wants plan standard (~1 GB).
    plan: free
    region: singapore
    rootDir: kb
    buildCommand: npm ci --omit=dev --ignore-scripts
    # seed.js copies the committed public-site snapshot (seed/kb.sqlite) into data/ when no database exists and
    # imports the customer-call answers from the secret file (/etc/secrets/qa_pages.jsonl.gz.b64)
    startCommand: node src/seed.js && node src/server.js
    healthCheckPath: /health
    envVars:
      - fromGroup: neha-shared
      - key: NODE_VERSION
        value: "24"
      - key: KB_HOST
        value: 0.0.0.0
      - key: KB_PORT
        value: "10000"
      - key: KB_TRUST_PROXY
        value: "1"
      - key: KB_SEARCH_REQUIRES_KEY  # the public URL answers searches only with KB_ADMIN_KEY
        value: "1"
      - key: KB_QUERY_PROVIDER
        value: gemini                # "local" once the service has >= 1 GB RAM (plan standard)
      - key: KB_LOCAL_MODEL
        value: none                  # the model OOM-killed a 512 MB free service; Render refuses an empty value
      - key: GEMINI_API_KEY
        sync: false
